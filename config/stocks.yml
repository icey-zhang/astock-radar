# ---------------------------------------------------------------
# A 股每日分析 - 配置文件
# ---------------------------------------------------------------

# 关注的股票列表(A 股 6 位代码)
# 替换为你自己想跟踪的标的
watchlist:
  - code: "600519"
    name: "贵州茅台"
  - code: "300750"
    name: "宁德时代"
  - code: "002594"
    name: "比亚迪"
  - code: "601318"
    name: "中国平安"
  - code: "601012"
    name: "隆基绿能"
  - code: "000858"
    name: "五粮液"
  - code: "600036"
    name: "招商银行"

# ---------------------------------------------------------------
# 策略参数
# ---------------------------------------------------------------
strategy:

  # 抄底信号判定(命中数 >= min_signals 才算有效抄底候选)
  dip_buy:
    rsi_period: 14
    rsi_threshold: 30           # RSI < 30 超卖
    bbands_period: 20
    bbands_std: 2
    bbands_tolerance: 1.02      # 收盘价 <= 下轨 * 1.02 即算跌破
    kdj_j_threshold: 0          # J < 0 极度超卖
    low_volume_ratio: 0.7       # 当日量 / 20日均量 < 0.7 算地量
    low_position_window: 60     # 近 60 日区间
    low_position_pct: 0.10      # 位于底部 10% 算低位
    min_signals: 3              # 最少命中信号数(调高更保守,调低更激进)

  # 止盈/止损(仅对有持仓的股票生效)
  exit:
    take_profit_pct: 0.20       # >= +20% 触发止盈 (核心策略)
    aggressive_tp_pct: 0.15     # >= +15% 且 RSI > 70 触发部分止盈
    stop_loss_pct: 0.08         # <= -8% 触发止损
    rsi_overbought: 70          # 超买阈值

# ---------------------------------------------------------------
# 运行/报告配置
# ---------------------------------------------------------------
runtime:
  kline_days: 250               # 拉取日线天数
  money_flow_days: 5            # 主力资金流天数
  data_dir: "data"
  report_dir: "reports"
  language: "zh"
