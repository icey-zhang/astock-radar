# ---------------------------------------------------------------
# 策略参数 v3.0:三策略架构
# ---------------------------------------------------------------
strategy:

  # ========== 策略 1:止盈(仅对持仓) ==========
  take_profit:
    tp_min_pnl_pct: 18.0          # 浮盈阈值(%),≥18% 即考虑触发(接近 20% 预警)
    tp_target_pct: 20.0           # 成本目标倍数(%),用于计算 cost_target 价位
    tp_trend_cum_pct: 3.0         # 近 5 天累计涨幅阈值(%),≥3% 判定为涨势
    tp_90d_position_pct: 60.0     # 90 天区间位置阈值(%),≥60% 算高位
    tp_90d_high_mult: 0.98        # 90 天高位乘数,用于计算 price_90d_high 卖价

  # ========== 策略 2:抄底(仅对未持仓) ==========
  dip_buy:
    dip_trend_cum_pct: 3.0        # 近 5 天累计跌幅阈值(%),≥3% 算有效
    dip_90d_low_tol: 1.02         # 接近 90 天低位的容差,跌破 低×1.02 算强信号
    dip_conservative_entry_mult: 1.01  # 稳健档买入价 = 90天最低 × 1.01
    dip_stop_loss_pct: 5.0        # 抄底失败的止损距离(%),用于提示退出价位

  # ========== 策略 3:激进波段(两者都适用) ==========
  swing:
    swing_min_signals: 2          # 命中数 ≥2 才触发
    swing_vol_mult: 1.5           # 量比 ≥1.5 判定放量
    swing_target_pct: 6.0         # 波段目标涨幅(%),用于计算目标卖价
    swing_stop_pct: 3.0           # 波段止损距离(%),用于计算止损价

# ---------------------------------------------------------------
# 运行/报告配置
# ---------------------------------------------------------------
runtime:
  # 分层数据模型(v2.0):
  close_history_days: 250       # 长周期:只拉收盘价,用于 MA60/RSI/MACD/60日低位
  kline_detail_days: 30         # 短周期:完整 OHLCV,用于 KDJ/布林带/量比/K线图
  money_flow_days: 5            # 主力资金流天数
  data_dir: "data"
  report_dir: "reports"
  language: "zh"
  # 兼容老字段(已废弃,analyze_signals 会自动识别两种格式)
  kline_days: 250
