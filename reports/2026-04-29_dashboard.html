  header {

  header .date { font-size: 14px; opacity: 0.85; margin-top: 4px; }
  header .disclaimer {

  }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 20px;
  }
  .stat {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px;
  }
  .stat .label { font-size: 12px; color: var(--text-sec); }
  .stat .value { font-size: 28px; font-weight: 600; margin-top: 4px; }
  .stat.tp .value { color: var(--warn); }
  .stat.dip .value { color: var(--accent); }
  .stat.swing .value { color: var(--swing); }

  section {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; margin-bottom: 20px;
  }
  section > h2 {
    font-size: 16px; font-weight: 600; margin-bottom: 14px;
    border-left: 3px solid var(--accent); padding-left: 10px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { background: #f9fafb; font-weight: 500; color: var(--text-sec); font-size: 12px; }
  tr:hover td { background: #fafbfc; }
  td.code { font-family: "SF Mono", Menlo, monospace; font-weight: 600; }

  .price-up { color: var(--up); font-weight: 500; }
  .price-down { color: var(--down); font-weight: 500; }
  .price-flat { color: var(--text-sec); }

  .tag {
    display: inline-block; padding: 3px 10px; border-radius: 4px;
    font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  .tag-hold        { background: #fef3c7; color: #92400e; }
  .tag-tp-watch    { background: #fed7aa; color: #9a3412; }
  .tag-tp-partial  { background: #fdba74; color: #7c2d12; }
  .tag-tp-strong   { background: #ea580c; color: white; font-weight: 600; }
  .tag-dip         { background: #e0e7ff; color: #3730a3; }
  .tag-dip-strong  { background: #4c6ef5; color: white; font-weight: 600; }
  .tag-swing       { background: #ede9fe; color: #6d28d9; }
  .tag-swing-hold  { background: #c4b5fd; color: #4c1d95; }
  .tag-watch       { background: #f3f4f6; color: #6b7280; }

  .tag-loss-moderate { background: #fed7aa; color: #9a3412; font-weight: 600; }
  .tag-loss-deep     { background: #fecaca; color: #991b1b; font-weight: 700; border: 1px solid #f87171; }

    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(580px, 1fr));
    gap: 16px;

  @media (max-width: 720px) { .stock-grid { grid-template-columns: 1fr; } }

  .stock-card {
    background: var(--card); border: 1px solid var(--border);

  }
  .stock-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

  .stock-head {

  .context-box .v { font-weight: 500; margin-left: 4px; }

  .strategy-box.hold      { background: #fffbeb; border-left-color: #d1d5db; }
  .strategy-box.inactive  { background: #f9fafb; border-left-color: #d1d5db; color: var(--text-sec); }

  .strategy-box .title { font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .strategy-box .price-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;

  .strategy-box .price-row > div .label {

  .strategy-box.swing ul.reasons li::before { color: var(--swing); }

window.AI_ANALYSIS = /* AI_ANALYSIS_START */{"002885": "<p><strong>1. 消息面摘要</strong></p>\n<ul>\n<li>2026-04-25 披露 2025 年年报：营收 33.47 亿元，归母净利润 8421 万元（来源：东方财富，2026-04-25）</li>\n<li>2026-04-26 一季报：营收 8.42 亿元（+6.11%），归母净利润 3077 万元（<strong>同比 +69.22%</strong>），盈利能力明显改善（来源：证券之星，2026-04-26）</li>\n<li>今日（4/29）主力净流入 9617 万元、超大单净流入 5481 万元，但 4/27 曾大幅净卖出 9470 万元，短线资金博弈性较强</li>\n</ul>\n<p><strong>2. 信号有效性复核</strong> 三项策略均未触发（5 日累计 -1.18%，90 日区间位置 70%）。一季报净利润同比 +69.22% 是明显的正面基本面，但技术面处于 90 日高位区间，当前价格未构成抄底或波段入场条件。今日资金流入更多是对一季报的短线反应，与技术信号无关。</p>\n<p><strong>3. 最终建议</strong> 三项策略均未触发，<strong>暂无操作信号，建议观望</strong>。基本面改善值得长期关注；如后续价格回调至 90 日区间中低位（参考 90 日低位 22.89 附近），可列入重点观察。</p>\n<p><strong>4. 风险点</strong></p>\n<ul>\n<li>变压器/电力设备行业景气度受宏观政策订单节奏影响，若 Q2 交货不及预期，股价易高位回调</li>\n<li>4/27 与 4/29 主力资金剧烈反转（净卖→净买），短线博弈氛围浓，方向不确定</li>\n</ul>\n<p>⚠ 仅供参考，不构成投资建议</p>", "002574": "<p><strong>1. 消息面摘要</strong></p>\n<ul>\n<li>2026-03-30 公告副总经理尹尚良因达法定退休年龄辞职，对经营无实质影响（来源：新浪财经）</li>\n<li>4 月 22 日召开 2025 年度股东大会，常规会议，无重大决议披露</li>\n<li>近 2 日未检索到重大业绩公告、行业政策利好或机构研报，消息面整体中性</li>\n</ul>\n<p><strong>2. 信号有效性复核</strong> 波段信号触发：MACD 金叉（近 3 日）+ 量比 3.02，两项命中。技术面上量能放大真实，但主力资金 5 日累计净流出（大单持续离场，今日净流出 7876 万元），量比放大更多依赖散户资金。消息面无催化剂支撑，信号既未被证伪，也缺乏消息面增强。今日收盘 5.68（较信号价 5.57 已上涨 +1.97%）。</p>\n<p><strong>3. 最终建议</strong> <strong>波段候选，低置信度，仅作短线试探</strong>。若在信号买入价 5.57 附近入场（注：今日已收 5.68，追高风险加大），目标 5.90（+6%），止损 <strong>5.40（-3%）须严格执行</strong>，不可挪动。主力持续净流出是主要减分项，若后续量比萎缩或价格回落破 5.55，建议及时离场。此为<strong>短线投机</strong>操作，独立资金管理，与中长线仓位严格分开。</p>\n<p><strong>4. 风险点</strong></p>\n<ul>\n<li>主力资金 5 日连续净流出，价格上涨更多依赖散户博弈，持续性存疑</li>\n<li>黄金珠宝行业对金价波动敏感，国际金价若出现较大回调将拖累板块</li>\n</ul>\n<p>⚠ 仅供参考，不构成投资建议</p>", "600690": "<p><strong>1. 消息面摘要</strong></p>\n<ul>\n<li>2025 年年报（3 月披露）：营收 3023 亿元（+5.71%），归母净利润 195 亿元（+4.39%），Q4 单季度净利润同比 -39.15%（来源：新浪财经/雪球，2026-03-27）</li>\n<li>董事会审议通过 <strong>60 亿元回购方案</strong>，回购上限价 35 元/股，12 个月内实施（来源：新浪财经）</li>\n<li>未来三年分红规划：2026 年现金分红比例不低于 58%，2027/2028 年不低于 60%（来源：年报）</li>\n</ul>\n<p><strong>2. 信号有效性复核</strong> 波段信号：量比 2.22 + 突破 10 日高点。60 亿元回购方案为波段上行提供基本面背书，有助于信号可信度。但今日（4/29）主力净流出 1.71 亿元、超大单净流出 1.28 亿元，大资金在突破点减仓迹象明显，需警惕&quot;量在价上&quot;的分歧。今日已收 21.64，高于信号价 21.34。</p>\n<p><strong>3. 最终建议</strong> <strong>波段候选，低置信度，建议等价格回调后再考虑入场</strong>。信号价 21.34 已被突破（收 21.64），追高风险加大；若后续回调至 21.34 或以下，可考虑轻仓试探，目标 22.62（+6%），止损 <strong>20.70（-3%）须严格执行</strong>。回购方案是中期支撑，但短线大资金流出不容忽视。此为<strong>短线操作</strong>，与中长线仓位分开。</p>\n<p><strong>4. 风险点</strong></p>\n<ul>\n<li>今日主力净流出 1.71 亿元，大资金在突破位减仓，后续若无增量资金跟进，波段可能夭折</li>\n<li>Q4 单季度净利润同比 -39.15%，若 2026Q1 业绩（4 月底披露）延续走弱，将压制估值修复空间</li>\n<li>全球家电需求受关税及贸易摩擦影响，海外收入占比高的白电龙头面临汇率和关税双重不确定性</li>\n</ul>\n<p>⚠ 仅供参考，不构成投资建议</p>", "600303": "<p><strong>1. 消息面摘要</strong> 近 2 日未检索到曙光股份（600303）重大公告、业绩或行业政策事件，消息面平静。</p>\n<p><strong>2. 信号有效性复核</strong> 三项策略均未触发。波段关注命中 1/4（仅突破 10 日高点），未达 2 项触发阈值；今日上涨 2.81% 但量比仅 0.72（缩量上涨），趋势延续性存疑。90 日区间位置 47%，处于中位，无明显方向性信号。</p>\n<p><strong>3. 最终建议</strong> <strong>三项策略均未触发，建议观望，暂无操作</strong>。</p>\n<p><strong>4. 风险点</strong></p>\n<ul>\n<li>缩量上涨形态持续性较弱，若量能无法跟上，上涨易夭折</li>\n</ul>\n<p>⚠ 仅供参考，不构成投资建议</p>", "002607": "<p><strong>1. 消息面摘要</strong></p>\n<ul>\n<li>控股股东李永新及一致行动人所持股份被司法冻结及标记比例达 <strong>85.74%</strong>，质押比例 61.84%，股权流动性极度紧张（来源：证券之星，2026-03-06）</li>\n<li>2025 年前三季度主营收入 16.57 亿元（同比 -21.09%），归母净利润 9196 万元（同比 <strong>-45.31%</strong>），业绩持续下滑（来源：同花顺）</li>\n<li>今日（4/29）主力净流入 8110 万元、超大单净流入 4817 万元，资金面出现明显异动，收盘 2.57（较 4/28 低点 2.46 上涨 +4.47%）</li>\n</ul>\n<p><strong>2. 信号有效性复核</strong> 策略 2 触发（强候选）：5 日新低 + 累计跌 -3.15%，跌破 90 日低位 2.46。技术面满足两项条件，信号价格有效。<strong>但消息面存在重大风险</strong>：控股股东 85.74% 股份被司法冻结，强制平仓风险可能制造额外抛压；业绩持续大幅下滑是基本面压制。今日大资金净流入是一定程度的正向信号，但信号买入价 2.46 已被超越（收 2.57），入场成本已上移。</p>\n<p><strong>3. 最终建议</strong> <strong>信号有效，但基本面风险较高，建议降档处理——再观察 1-2 日再决策</strong>。若决意参与，须等价格回落至稳健档 2.48 附近或以下，以极小仓位试探首批，止损 <strong>2.34（-5%）须严格执行</strong>。切勿满仓操作。建议持续观察主力资金是否连续净流入，确认资金面支撑再加仓。</p>\n<p><strong>4. 风险点</strong></p>\n<ul>\n<li>控股股东 85.74% 股份司法冻结，后续若进行强制平仓，将产生集中抛压</li>\n<li>营收同比下滑 21%，净利润同比 -45%，业绩长期承压，估值修复路径不清晰</li>\n<li>AI 技能培训布局&quot;尚无达到信息披露标准的重大进展&quot;，需警惕概念炒作降温</li>\n</ul>\n<p>⚠ 仅供参考，不构成投资建议</p>", "600053": "<p><strong>1. 消息面摘要</strong></p>\n<ul>\n<li><strong>2026-04-26 重大公告</strong>：九鼎投资下修 2025 年业绩预告，净亏损扩大至 3.4 亿元 ~3.7 亿元；扣非营收仅 2.70 亿元~2.90 亿元，<strong>低于 3 亿元门槛</strong>，年报披露后股票可能被实施<strong>退市风险警示（ST）</strong>（来源：新浪财经，2026-04-26）</li>\n<li>4 月 27 日一字跌停（-9.99%），4 月 28 日再次跌停（-10.00%），两日连续封死跌停板（来源：每日经济新闻，2026-04-27）</li>\n<li>下修原因：私募股权管理业务估值及收入持续下滑，房地产业务资产减值，递延所得税资产终止确认（来源：新浪财经，2026-04-27）</li>\n</ul>\n<p><strong>2. 信号有效性复核</strong> 策略 2 触发（强候选）：5 日累计跌 -20.84%，跌破 90 日低位 11.43。技术面满足两项条件，但<strong>消息面构成重大基本面塌方</strong>：退市风险警示（ST）一旦实施，涨跌停幅收窄至 5%，流动性骤降，退出成本极高；主营业务私募股权管理收入持续萎缩，无明确反转迹象；量比仅 0.17（极度缩量），主力资金 5 日连续净流出。<strong>信号被消息面明确证伪。</strong></p>\n<p><strong>3. 最终建议</strong> <strong>明确建议放弃抄底</strong>，激进档（11.43）和稳健档（11.54）均不适用。理由：① ST 风险实质是基本面塌方；② 连续跌停尚未打开，底部无法判断；③ 即便跌停打开也需等年报正式披露、ST 公告落地后重新评估，当前阶段无可操作依据。</p>\n<p><strong>4. 风险点</strong></p>\n<ul>\n<li>年报披露后若扣非营收确认低于 3 亿，ST 正式落地，每日 5% 幅限将使退出极难</li>\n<li>私募股权底层资产可能存在进一步估值减记，亏损规模存在超出预告范围的可能</li>\n<li>管理层未能准确预告业绩（年报披露前 2 天才变脸），信息透明度存疑</li>\n</ul>\n<p>⚠ 仅供参考，不构成投资建议</p>"}/* AI_ANALYSIS_END */;

function fmtPct(v) {
  if (v === null || v === undefined || v === '') return '-';
  const n = parseFloat(v);
  const cls = n > 0 ? 'price-up' : (n < 0 ? 'price-down' : 'price-flat');
  const sign = n > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${n.toFixed(2)}%</span>`;
}
function fmtNum(v, digits = 2) {
  if (v === null || v === undefined || v === '') return '-';
  const n = parseFloat(v);
  if (isNaN(n)) return '-';
  return n.toFixed(digits);
}
function priceColor(pct) {
  if (pct === null || pct === undefined) return 'price-flat';
  return pct > 0 ? 'price-up' : (pct < 0 ? 'price-down' : 'price-flat');
}

function renderSummaryTable() {
  const tbody = document.querySelector('#summary-table tbody');
  const rows = DATA.stocks.map(s => {
    const q = s.quote || {};
    const ctx = s.context || {};
    const trend = ctx.trend_5d || {};
    const rng = ctx.range_90d || {};

    // 浮亏预警(不改变决策,只在标签后追加)
    let lossBadge = '';
    const tp = s.strategy_take_profit;
    if (tp && tp.loss_warning) {
      const lw = tp.loss_warning;
      lossBadge = ` <span class="tag tag-loss-${lw.level}" title="浮亏 ${lw.pnl_pct}%">⚠ ${lw.level_cn}</span>`;
    }

    return `<tr>
      <td class="code">${s.code}</td>
      <td>${s.name}</td>
      <td>${fmtNum(q.price)}</td>
      <td>${fmtPct(q.pct_change)}</td>
      <td>${fmtPct(trend.cum_pct)}</td>
      <td>${rng.position_pct !== null && rng.position_pct !== undefined ? rng.position_pct.toFixed(0) + '%' : '-'}</td>
      <td><span class="tag ${s.decision_class}">${s.decision}</span>${lossBadge}</td>
    </tr>`;
  }).join('');
  tbody.innerHTML = rows;
}

function renderStrategyTP(tp, pos) {
  if (!tp) return '';
  const triggered = tp.triggered;
  const strong = tp.action === 'SELL_STRONG';
  const cls = `strategy-box tp${strong ? ' strong' : ''}`;

  const pnl = tp.position.pnl_pct;
  const pnlCls = priceColor(pnl);
  const reasonsHTML = tp.reasons.length
    ? `<ul class="reasons">${tp.reasons.map(r => `<li>${r}</li>`).join('')}</ul>`
    : '<div style="font-size:12px;color:var(--text-sec)">(未满足触发条件)</div>';

  const confKey = {'高':'h','中':'m','低':'l','较高':'较高','未触发':'l'}[tp.confidence] || 'l';

  // 浮亏预警标签(仅视觉)
  let lossBadge = '';
  if (tp.loss_warning) {
    const lw = tp.loss_warning;
    lossBadge = `<span class="tag tag-loss-${lw.level}" title="仅视觉提示,不给具体动作">⚠ ${lw.level_cn}</span>`;
  }

  return `
    <div class="${cls}">
      <div class="title">
        💰 策略1 · 止盈(持仓)
        <span class="tag tag-${tp.action === 'SELL_STRONG' ? 'tp-strong' : 'tp-partial'}">${tp.action_cn}</span>
        ${lossBadge}
        <span class="confidence ${confKey}">置信度 ${tp.confidence}</span>
      </div>
      <div style="font-size:12px;margin-bottom:6px">
        成本 ${fmtNum(tp.position.cost_price)} · 现价 ${fmtNum(tp.position.current_price)} ·
        持股 ${tp.position.shares} ·
        浮盈 <strong class="${pnlCls}">${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}%</strong>
      </div>
      <div class="price-row">
        <div><span class="label">建议卖出价</span><span class="val">${fmtNum(tp.suggested_exit_price)}</span></div>
        <div><span class="label">价位依据</span><span class="val" style="font-size:12px">${tp.exit_basis === '90d_high' ? '90天高位 × 0.98' : '成本 × 1.20'}</span></div>
      </div>
      ${reasonsHTML}
    </div>
  `;
}

    </div>

}

  const contextHTML = `
    <div class="context-box">
      <div><span class="k">5日累计</span><span class="v">${fmtPct(trend.cum_pct)}</span></div>
      <div><span class="k">5日涨/跌</span><span class="v">${trend.days_up}涨/${trend.days_down}跌</span></div>
      <div><span class="k">90日高</span><span class="v">${fmtNum(rng.high)}</span></div>
      <div><span class="k">90日低</span><span class="v">${fmtNum(rng.low)}</span></div>
      <div><span class="k">区间位置</span><span class="v">${rng.position_pct !== null && rng.position_pct !== undefined ? rng.position_pct.toFixed(0) + '%' : '-'}</span></div>
      <div><span class="k">PE/PB</span><span class="v">${fmtNum(q.pe_ttm)} / ${fmtNum(q.pb)}</span></div>
    </div>
  `;

  const tpHTML = renderStrategyTP(s.strategy_take_profit, s.position);
  const dipHTML = renderStrategyDip(s.strategy_dip_buy);
  const swHTML = renderStrategySwing(s.strategy_swing);

  return `
    <div class="stock-card" id="card-${s.code}">
      <div class="stock-head">
        <span class="code">${s.code}</span>
        <span class="name">${s.name}</span>
        <span class="tag ${s.decision_class}">${s.decision}</span>
        <span class="price ${priceColor(pct)}">${fmtNum(q.price)}</span>
        ${pctStr}
      </div>
      ${contextHTML}
      <div class="chart" id="chart-${s.code}"></div>
      ${tpHTML}
      ${dipHTML}
      ${swHTML}
      ${(() => {
        const ai = (window.AI_ANALYSIS || {})[s.code];
        if (ai) {
          return `<div class="ai-block filled" id="ai-${s.code}">
            <strong>🤖 AI 综合分析</strong>
            <div style="margin-top:8px">${ai}</div>
          </div>`;
        }
        return `<div class="ai-block" id="ai-${s.code}">
          <strong>🤖 AI 综合分析(消息面)</strong>
          <div class="placeholder">待 Routine 补充:最近公告/业绩/行业/突发事件;确认信号有效性;生成最终决策建议。</div>
        </div>`;
      })()}
    </div>
  `;
}

function renderChart(stock) {
  const el = document.getElementById(`chart-${stock.code}`);
  if (!stock.chart || !el) return;
  const c = stock.chart;
  const chart = echarts.init(el);

  const option = {
    animation: false,
    grid: [
      { left: '8%', right: '4%', top: '6%', height: '62%' },
      { left: '8%', right: '4%', top: '74%', height: '18%' }
    ],
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross' },
      backgroundColor: 'rgba(255,255,255,0.96)',
      borderColor: '#e4e7eb',
      textStyle: { color: '#1f2329', fontSize: 12 }
    },
    legend: {
      data: ['K线', 'MA5', 'MA10', 'MA20', '布林上', '布林下'],
      top: 0, textStyle: { fontSize: 11 },
      selected: { '布林上': false, '布林下': false }
    },
    xAxis: [
      { type: 'category', data: c.dates, boundaryGap: false, axisLine: { onZero: false },
        splitLine: { show: false }, axisLabel: { fontSize: 10 } },
      { type: 'category', gridIndex: 1, data: c.dates, boundaryGap: false,
        axisLine: { onZero: false }, axisTick: { show: false }, axisLabel: { show: false } }
    ],
    yAxis: [
      { scale: true, splitArea: { show: false }, axisLabel: { fontSize: 10 } },
      { gridIndex: 1, splitNumber: 2, axisLine: { show: false },
        axisTick: { show: false }, axisLabel: { show: false }, splitLine: { show: false } }
    ],
    axisPointer: { link: [{ xAxisIndex: 'all' }] },
    dataZoom: [{ type: 'inside', xAxisIndex: [0, 1], start: 0, end: 100 }],
    series: [
      { name: 'K线', type: 'candlestick', data: c.ohlc,
        itemStyle: {
          color: '#d9322d', color0: '#0a9a5a',
          borderColor: '#d9322d', borderColor0: '#0a9a5a'
        }
      },
      { name: 'MA5', type: 'line', data: c.ma5, smooth: true,
        lineStyle: { width: 1, color: '#f59e0b' }, symbol: 'none' },
      { name: 'MA10', type: 'line', data: c.ma10, smooth: true,
        lineStyle: { width: 1, color: '#4c6ef5' }, symbol: 'none' },
      { name: 'MA20', type: 'line', data: c.ma20, smooth: true,
        lineStyle: { width: 1, color: '#8b5cf6' }, symbol: 'none' },
      { name: '布林上', type: 'line', data: c.bb_upper,
        lineStyle: { width: 1, type: 'dashed', color: '#9ca3af', opacity: 0.6 }, symbol: 'none' },
      { name: '布林下', type: 'line', data: c.bb_lower,
        lineStyle: { width: 1, type: 'dashed', color: '#9ca3af', opacity: 0.6 }, symbol: 'none' },
      { name: '成交量', type: 'bar',
        xAxisIndex: 1, yAxisIndex: 1,
        data: c.volumes.map((v, i) => ({
          value: v,
          itemStyle: { color: c.ohlc[i][1] >= c.ohlc[i][0] ? '#d9322d' : '#0a9a5a' }
        }))
      }
    ]
  };
  chart.setOption(option);
  window.addEventListener('resize', () => chart.resize());
}

function init() {
  renderStats();
  renderSummaryTable();
  document.getElementById('stock-grid').innerHTML = DATA.stocks.map(renderStockCard).join('');
  DATA.stocks.forEach(renderChart);
}
document.addEventListener('DOMContentLoaded', init);

window.fillAIAnalysis = function(code, htmlContent) {
  const el = document.getElementById(`ai-${code}`);
  if (!el) return;
  el.classList.add('filled');
  el.innerHTML = `<strong>🤖 AI 综合分析</strong><div style="margin-top:8px">${htmlContent}</div>`;
};
</script>
</body>
</html>
